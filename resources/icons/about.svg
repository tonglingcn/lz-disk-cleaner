<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="infoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e88e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 信息图标背景圆 -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGradient)" stroke="#42a5f5" stroke-width="2"/>
  
  <!-- 内圈装饰 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#42a5f5" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>
  
  <!-- 顶部圆点（i的点） -->
  <circle cx="32" cy="18" r="5" fill="url(#infoGradient)"/>
  <circle cx="32" cy="18" r="2" fill="white"/>
  
  <!-- 底部竖线（i的线） -->
  <rect x="28" y="28" width="8" height="22" rx="2" ry="2" fill="url(#infoGradient)"/>
  
  <!-- 装饰性元素 -->
  <circle cx="16" cy="16" r="2" fill="#90caf9" opacity="0.6"/>
  <circle cx="48" cy="16" r="2" fill="#90caf9" opacity="0.6"/>
  <circle cx="16" cy="48" r="2" fill="#90caf9" opacity="0.6"/>
  <circle cx="48" cy="48" r="2" fill="#90caf9" opacity="0.6"/>
  
  <!-- 底部阴影 -->
  <ellipse cx="32" cy="58" rx="26" ry="2" fill="#000" opacity="0.2"/>
</svg>