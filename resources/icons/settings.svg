<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7986cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c6bc0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 齿轮主体 -->
  <g fill="url(#gearGradient)">
    <!-- 8个齿 -->
    <rect x="28" y="4" width="8" height="10" rx="1" ry="1"/>
    <rect x="28" y="50" width="8" height="10" rx="1" ry="1"/>
    <rect x="4" y="28" width="10" height="8" rx="1" ry="1"/>
    <rect x="50" y="28" width="10" height="8" rx="1" ry="1"/>
    
    <!-- 对角齿 -->
    <rect x="10" y="10" width="8" height="8" rx="1" ry="1" transform="rotate(45 14 14)"/>
    <rect x="46" y="10" width="8" height="8" rx="1" ry="1" transform="rotate(-45 50 14)"/>
    <rect x="10" y="46" width="8" height="8" rx="1" ry="1" transform="rotate(-45 14 50)"/>
    <rect x="46" y="46" width="8" height="8" rx="1" ry="1" transform="rotate(45 50 50)"/>
  </g>
  
  <!-- 齿轮圆环 -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#gearGradient)" stroke-width="6"/>
  
  <!-- 齿轮中心孔 -->
  <circle cx="32" cy="32" r="8" fill="url(#centerGradient)" stroke="#303f9f" stroke-width="2"/>
  
  <!-- 中心装饰点 -->
  <circle cx="32" cy="32" r="3" fill="#c5cae9"/>
  
  <!-- 设置指示点（小圆点装饰） -->
  <circle cx="48" cy="8" r="2" fill="#ffeb3b"/>
  <circle cx="56" cy="16" r="1.5" fill="#ffeb3b"/>
  <circle cx="8" cy="48" r="2" fill="#ffeb3b"/>
  <circle cx="16" cy="56" r="1.5" fill="#ffeb3b"/>
  
  <!-- 底部阴影 -->
  <ellipse cx="32" cy="60" rx="22" ry="2" fill="#000" opacity="0.2"/>
</svg>