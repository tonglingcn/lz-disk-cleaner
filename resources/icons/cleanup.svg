<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="broomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52c41a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389e0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8956a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 扫把柄 -->
  <rect x="28" y="8" width="8" height="32" rx="2" ry="2" fill="url(#handleGradient)" stroke="#8b6914" stroke-width="1"/>
  
  <!-- 扫把头主体 -->
  <rect x="12" y="36" width="40" height="8" rx="2" ry="2" fill="url(#broomGradient)" stroke="#2f5e0a" stroke-width="1"/>
  
  <!-- 扫把毛 -->
  <g stroke="#52c41a" stroke-width="2" stroke-linecap="round">
    <line x1="14" y1="44" x2="12" y2="52"/>
    <line x1="18" y1="44" x2="16" y2="54"/>
    <line x1="22" y1="44" x2="20" y2="56"/>
    <line x1="26" y1="44" x2="24" y2="58"/>
    <line x1="30" y1="44" x2="28" y2="60"/>
    <line x1="34" y1="44" x2="32" y2="58"/>
    <line x1="38" y1="44" x2="36" y2="56"/>
    <line x1="42" y1="44" x2="40" y2="54"/>
    <line x1="46" y1="44" x2="44" y2="52"/>
    <line x1="50" y1="44" x2="48" y2="50"/>
  </g>
  
  <!-- 清理效果指示（闪光） -->
  <g fill="#ffd700">
    <polygon points="52,12 54,18 60,18 55,22 57,28 52,24 47,28 49,22 44,18 50,18" transform="scale(0.6) translate(35, 10)"/>
    <polygon points="8,20 10,26 16,26 11,30 13,36 8,32 3,36 5,30 0,26 6,26" transform="scale(0.5) translate(5, 15)"/>
  </g>
  
  <!-- 底部阴影 -->
  <ellipse cx="32" cy="60" rx="20" ry="2" fill="#000" opacity="0.2"/>
</svg>