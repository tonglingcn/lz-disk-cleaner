<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- CPU 芯片主体 -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="#0D1117" stroke="#3498DB" stroke-width="3"/>
  
  <!-- CPU 内部细节 -->
  <rect x="18" y="18" width="28" height="28" rx="2" fill="#161B22"/>
  
  <!-- 核心区域 - 更加鲜艳的蓝色 -->
  <rect x="20" y="20" width="12" height="12" rx="1" fill="#3498DB"/>
  <rect x="34" y="20" width="12" height="12" rx="1" fill="#3498DB"/>
  <rect x="20" y="34" width="12" height="12" rx="1" fill="#3498DB"/>
  <rect x="34" y="34" width="12" height="12" rx="1" fill="#3498DB"/>
  
  <!-- 引脚 - 上方 -->
  <line x1="20" y1="14" x2="20" y2="10" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="14" x2="28" y2="10" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="14" x2="36" y2="10" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="14" x2="44" y2="10" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 引脚 - 下方 -->
  <line x1="20" y1="50" x2="20" y2="54" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="28" y2="54" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="50" x2="36" y2="54" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="50" x2="44" y2="54" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 引脚 - 左侧 -->
  <line x1="14" y1="20" x2="10" y2="20" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="10" y2="28" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="36" x2="10" y2="36" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="44" x2="10" y2="44" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 引脚 - 右侧 -->
  <line x1="50" y1="20" x2="54" y2="20" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="28" x2="54" y2="28" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="54" y2="36" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="44" x2="54" y2="44" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
</svg>
